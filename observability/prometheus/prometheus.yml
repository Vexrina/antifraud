global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: 'processing_core'
    static_configs:
      - targets: [ 'processing-core:9100']

  - job_name: 'antifraud'
    static_configs:
      - targets: [ 'antifraud:9101' ]