services:
  postgres:
    container_name: core_postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: proc_core_user
      POSTGRES_PASSWORD: proc_core_pwd
      POSTGRES_DB: proc_core_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U proc_core_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrate:
    image: migrate/migrate:latest
    container_name: core_postgre_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://proc_core_user:proc_core_pwd@postgres:5432/proc_core_db?sslmode=disable
    volumes:
      - ./migrations:/migrations
    command: [ "-path", "/migrations", "-database", "postgres://proc_core_user:proc_core_pwd@postgres:5432/proc_core_db?sslmode=disable", "up" ]

  processing-core:
    container_name: processing-core
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GRPC_PORT: "9090"
      DB_CONNSTR: postgres://proc_core_user:proc_core_pwd@postgres:5432/proc_core_db?sslmode=disable
    ports:
      - "9090:9090"   # gRPC
      - "9100:9100"   # metrics
    restart: unless-stopped

volumes:
  postgres_data:
