version: '3.8'

networks:
  redpanda_net:
    driver: bridge

services:
  clickhouse-server:
    image: clickhouse/clickhouse-server:23.9
    container_name: clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: myuser
      CLICKHOUSE_PASSWORD: mypass
      CLICKHOUSE_DEFAULT_DATABASE: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./processing_core/api:/var/lib/clickhouse/format_schemas
      - ./third_party/protobuf:/var/lib/clickhouse/format_schemas/google/protobuf
    networks:
      - redpanda_net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.6
    container_name: redpanda
    command: >
      redpanda start
      --overprovisioned
      --smp 1
      --memory 1G
      --reserve-memory 0M
      --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - redpanda_net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.3.2
    container_name: redpanda-console
    depends_on:
      - redpanda
    volumes:
      - ./console.yaml:/etc/redpanda/console.yaml:ro
    command: ["--config.filepath", "/etc/redpanda/console.yaml"]
    ports:
      - "8080:8080"
    networks:
      - redpanda_net

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"  # Cassandra CQL
    environment:
      CASSANDRA_CLUSTER_NAME: 'AntifraudCluster'
      CASSANDRA_DC: 'dc1'
      CASSANDRA_RACK: 'rack1'
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - redpanda_net

  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redpanda_net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    user: root
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./airflow:/opt/airflow
    command: >
      bash -c "
      mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins &&
      chown -R 50000:0 /opt/airflow &&
      airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin "
    networks:
      - redpanda_net
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "50000:0"
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ./airflow:/opt/airflow
    command: webserver
    networks:
      - redpanda_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    depends_on:
      airflow-webserver:
        condition: service_started
    user: "50000:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./airflow:/opt/airflow
    command: scheduler
    networks:
      - redpanda_net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "7070:9090"
    networks:
      - redpanda_net

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - redpanda_net

  core_postgres:
    container_name: core_postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: proc_core_user
      POSTGRES_PASSWORD: proc_core_pwd
      POSTGRES_DB: proc_core_db
    ports:
      - "5433:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U proc_core_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redpanda_net

  migrate:
    image: migrate/migrate:latest
    container_name: core_postgre_migrate
    depends_on:
      core_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://proc_core_user:proc_core_pwd@core_postgres:5432/proc_core_db?sslmode=disable
    volumes:
      - ./processing_core/migrations:/migrations
    command: [ "-path", "/migrations", "-database", "postgres://proc_core_user:proc_core_pwd@core_postgres:5432/proc_core_db?sslmode=disable", "up" ]
    networks:
      - redpanda_net

  processing-core:
    container_name: processing-core
    build:
      context: ./processing_core
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GRPC_PORT: "9090"
      DB_CONNSTR: postgres://proc_core_user:proc_core_pwd@core_postgres:5432/proc_core_db?sslmode=disable
      KAFKA_PRODUCER: redpanda:9092
    ports:
      - "9090:9090"   # gRPC
      - "9100:9100"   # metrics
    restart: unless-stopped
    networks:
      - redpanda_net


volumes:
  clickhouse_data:
  redpanda_data:
  cassandra_data:
  airflow_logs:
  airflow_dags:
  airflow_plugins:
  postgres_data:
  prometheus_data:
  grafana_data:
  core_postgres_data:
